<div class="bg-[#1c1c24] min-h-screen flex items-center justify-center p-4">

  <div
    class="w-full max-w-[1200px] bg-[#13131a] rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row"
  >


    <div class="w-full md:w-1/2 relative">

      <span
        class="absolute top-6 left-6 text-white text-2xl font-bold z-10"
      >
        ARK
      </span>


      <a
        routerLink="/login"
        class="absolute top-6 right-6 bg-white/10 backdrop-blur-sm text-white px-4 py-2 rounded-full text-sm hover:bg-white/20 transition-colors z-10 cursor-pointer"
      >
        Back to login →
      </a>

      <div class="relative h-full min-h-[500px]">

        <img
          src="https://distillery.com/wp-content/uploads/2024/10/Why-Agile-is-the-Secret-Sauce-for-Successful-Software-Projects-1080x675.png"
          alt="Desarrollo de proyectos"
          class="w-full h-full object-cover"
        >

        <div class="absolute inset-0 bg-cyan-500/30"></div>

        <div class="absolute bottom-12 left-12 text-white">

          <h2 class="text-2xl md:text-4xl font-semibold mb-2">
            Desarrollo de proyectos
          </h2>

          <div class="flex gap-2 mt-6">
            <div class="w-4 h-1 bg-white/30 rounded"></div>
            <div class="w-4 h-1 bg-white/30 rounded"></div>
            <div class="w-4 h-1 bg-white rounded"></div>
          </div>

        </div>

      </div>

    </div>



    <div class="w-full md:w-1/2 p-6 md:p-12">

      <div class="max-w-md mx-auto">

        <h1 class="text-white text-2xl md:text-4xl font-semibold mb-2">
          Create an account
        </h1>

        <p class="text-gray-400 mb-8">
          Already have an account?

          <a
            routerLink="/login"
            class="text-white hover:underline cursor-pointer"
          >
            Log in
          </a>
        </p>



        <form
          class="space-y-4"
          (ngSubmit)="registrar()"
        >


          <input
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Ingrese el nombre"
            autocomplete="name"
            class="w-full bg-[#1c1c24] text-white rounded-lg p-3
                   focus:outline-none focus:ring-2 focus:ring-cyan-500"
          >



          <input
            type="email"
            name="correo"
            [(ngModel)]="correo"
            placeholder="Correo electrónico"
            autocomplete="email"
            class="w-full bg-[#1c1c24] text-white rounded-lg p-3
                   focus:outline-none focus:ring-2 focus:ring-cyan-500"
          >



          <input
            type="password"
            name="contrasenia"
            [(ngModel)]="contrasenia"
            placeholder="Contraseña"
            autocomplete="new-password"
            class="w-full bg-[#1c1c24] text-white rounded-lg p-3
                   focus:outline-none focus:ring-2 focus:ring-cyan-500"
          >



          <input
            type="password"
            name="confirmarContrasenia"
            [(ngModel)]="confirmarContrasenia"
            placeholder="Confirmar contraseña"
            autocomplete="new-password"
            class="w-full bg-[#1c1c24] text-white rounded-lg p-3
                   focus:outline-none focus:ring-2 focus:ring-cyan-500"
          >



          <label
            class="flex items-center space-x-2 cursor-pointer"
          >

            <input
              type="checkbox"
              name="aceptaTerminos"
              [(ngModel)]="aceptaTerminos"
              class="rounded bg-[#1c1c24] border-gray-600
                     text-cyan-500 focus:ring-cyan-500"
            >

            <span class="text-gray-400">
              I agree to the
              <span class="text-white">
                Terms & Conditions
              </span>
            </span>

          </label>



          @if (mensaje) {

            <div
              class="w-full bg-red-500 text-white rounded-lg p-3 text-sm"
            >
              {{ mensaje }}
            </div>

          }



          <button
            type="submit"
            class="w-full bg-cyan-600 text-white font-semibold rounded-lg p-3
                   hover:bg-cyan-500 transition-colors cursor-pointer"
          >
            Create account
          </button>



          <div class="relative my-8">

            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-700"></div>
            </div>

            <div class="relative flex justify-center">

              <div class="flex flex-row gap-2 bg-[#13131a] px-4">

                <div
                  class="w-4 h-4 rounded-full bg-cyan-500 animate-bounce"
                ></div>

                <div
                  class="w-4 h-4 rounded-full bg-cyan-500 animate-bounce
                         [animation-delay:-.3s]"
                ></div>

                <div
                  class="w-4 h-4 rounded-full bg-cyan-500 animate-bounce
                         [animation-delay:-.5s]"
                ></div>

              </div>

            </div>

          </div>

        </form>

      </div>

    </div>

  </div>

</div>
