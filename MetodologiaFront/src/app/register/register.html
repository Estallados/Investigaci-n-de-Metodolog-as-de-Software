<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-[#1c1c24] min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[1200px] bg-[#13131a] rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row">
  <!-- Left Section -->
  <div class="w-full md:w-1/2 relative">
    <a href="#" class="absolute top-6 left-6 text-white text-2xl font-bold z-10">ARK</a>
    <a routerLink="/login" class="absolute top-6 right-6 bg-white/10 backdrop-blur-sm text-white px-4 py-2 rounded-full text-sm hover:bg-white/20 transition-colors z-10">
      Back to login →
    </a>
    <div class="relative h-full">
      <img src="https://distillery.com/wp-content/uploads/2024/10/Why-Agile-is-the-Secret-Sauce-for-Successful-Software-Projects-1080x675.png"
           alt="Desert landscape"
           class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-cyan-500/30"></div>
      <div class="absolute bottom-12 left-12 text-white">
        <h2 class="text-2xl md:text-4xl font-semibold mb-2">Desarrollo de proyectos</h2>
        <h2 class="text-2xl md:text-4xl font-semibold"></h2>
        <div class="flex gap-2 mt-6">
          <div class="w-4 h-1 bg-white/30 rounded"></div>
          <div class="w-4 h-1 bg-white/30 rounded"></div>
          <div class="w-4 h-1 bg-white rounded"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Section -->
  <div class="w-full md:w-1/2 p-6 md:p-12">
    <div class="max-w-md mx-auto">
      <h1 class="text-white text-2xl md:text-4xl font-semibold mb-2">Create an account</h1>
      <p class="text-gray-400 mb-8">
        Already have an account?
        <a  routerLink="/login" class="text-white hover:underline">Log in</a>
      </p>

      <form class="space-y-4">
        <div class="flex flex-col md:flex-row gap-4">
          <input type="text" placeholder="Ingrese el nombre" class="w-full md:w-1/2 bg-[#1c1c24] text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-cyan-500">

        </div>
        <input type="email" placeholder="Email" class="w-full bg-[#1c1c24] text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-cyan-500">


        <input type="password" placeholder="Contraseña" class="w-full bg-[#1c1c24] text-white rounded-lg p-3 pr-10 focus:outline-none focus:ring-2 focus:ring-cyan-500">

        <div class="relative">

          <input type="password" placeholder="Confrimar contraseña" class="w-full bg-[#1c1c24] text-white rounded-lg p-3 pr-10 focus:outline-none focus:ring-2 focus:ring-cyan-500">

        </div>

        <label class="flex items-center space-x-2 cursor-pointer">
          <input type="checkbox" class="rounded bg-[#1c1c24] border-gray-600 text-cyan-500 focus:ring-cyan-500">
          <span class="text-gray-400">I agree to the <a href="#" class="text-white hover:underline">Terms & Conditions</a></span>
        </label>

        <button type="submit" class="w-full text-white rounded-lg p-3 hover:bg-cyan-500 transition-colors">
          Create account
        </button>

        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-700"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <div class="flex flex-row gap-2">
              <div class="w-4 h-4 rounded-full bg-cyan-500 animate-bounce"></div>
              <div class="w-4 h-4 rounded-full bg-cyan-500 animate-bounce [animation-delay:-.3s]"></div>
              <div class="w-4 h-4 rounded-full bg-cyan-500 animate-bounce [animation-delay:-.5s]"></div>
            </div>
          </div>
        </div>


      </form>
    </div>
  </div>
</div>
</body>
</html>
